name: Verified Apple Silicon bottles
on:
  workflow_dispatch:
    inputs:
      formula_sha256:
        description: Exact reviewed stable formula SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mb-bottles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPECTED_FORMULA_SHA256: ${{ inputs.formula_sha256 }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ASK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Cold RC4 source install, real stable upgrade and bottle
        run: python3 ci/bottle-ci.py build
      - name: Retain exact bottle and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mb-macos26-arm64
          path: artifacts/
          if-no-files-found: error
          retention-days: 3
  pour:
    needs: build
    runs-on: macos-26
    timeout-minutes: 20
    env:
      EXPECTED_FORMULA_SHA256: ${{ inputs.formula_sha256 }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ASK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: mb-macos26-arm64
          path: artifacts/
      - name: Fresh bottle-only pour, relocation and installed tests
        run: python3 ci/bottle-ci.py pour
      - name: Retain fresh-pour evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mb-macos26-arm64-pour-evidence
          path: artifacts/pour-evidence.json
          if-no-files-found: error
          retention-days: 3
